<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Great Egg Hunt</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #d4a574;
  --dark: #0f0e0c;
  --cream: #f5efe6;
  --accent: #c8956c;
  --green: #7ddf7d;
  --red: #e07a5f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--dark);
  color: var(--cream);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; opacity: 0.03;
  background-image: radial-gradient(circle at 25% 25%, var(--gold) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
.container {
  position: relative; z-index: 1;
  max-width: 480px; margin: 0 auto; padding: 24px 20px;
}
.header {
  text-align: center; margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid rgba(212,165,116,0.15);
}
.header .egg { font-size: 28px; margin-bottom: 8px; }
.header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 26px; font-weight: 700;
  color: var(--gold); letter-spacing: 1px;
}
.header .sub { color: var(--cream); opacity: 0.4; font-size: 13px; margin-top: 6px; }
.clue-title {
  font-family: 'Playfair Display', serif;
  font-size: 24px; color: var(--gold); margin-bottom: 16px;
}
.desc { color: var(--cream); opacity: 0.7; margin-bottom: 16px; font-size: 15px; line-height: 1.6; }
.puzzle-box {
  background: rgba(212,165,116,0.08);
  border-radius: 12px; padding: 24px; margin-bottom: 24px;
  border: 1px solid rgba(212,165,116,0.15);
}
.input-row { display: flex; gap: 12px; }
.text-input {
  flex: 1; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(212,165,116,0.25);
  border-radius: 8px; padding: 12px 16px;
  color: var(--cream); font-size: 16px;
  font-family: 'DM Sans', sans-serif; outline: none;
}
.text-input:focus { border-color: var(--gold); }
.text-input::placeholder { color: rgba(245,239,230,0.3); }
.btn {
  background: var(--gold); color: var(--dark); border: none;
  border-radius: 8px; padding: 12px 24px; font-size: 15px;
  font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif;
  white-space: nowrap;
}
.btn:hover { opacity: 0.9; }
.hint-btn {
  background: none; border: none; color: var(--accent);
  opacity: 0.5; cursor: pointer; font-size: 13px;
  text-decoration: underline; margin-top: 16px; display: block;
}
.hint-text { color: var(--accent); font-size: 14px; font-style: italic; opacity: 0.7; margin-top: 16px; }
.error { color: var(--red); margin-top: 10px; font-size: 14px; }
.success-card {
  animation: fadeUp 0.6s ease-out;
  background: rgba(125,223,125,0.06);
  border: 1px solid rgba(125,223,125,0.2);
  border-radius: 12px; padding: 24px;
  text-align: center; margin-top: 20px;
}
.success-card .egg-icon { font-size: 40px; margin-bottom: 12px; }
.success-card .answer {
  color: var(--green); font-size: 18px;
  font-family: 'Playfair Display', serif;
  font-weight: 600; margin-bottom: 8px;
}
.success-card .message { color: var(--cream); opacity: 0.7; font-size: 15px; line-height: 1.5; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
.fade-in { animation: fadeUp 0.5s ease-out; }
.mono { font-family: 'Courier Prime', monospace; }
</style>
</head>
<body>
<div class="container">
<div class="header">
  <div class="egg">🥚</div>
  <h1>The Great Egg Hunt</h1>
  <p class="sub">Clue 5 of 5</p>
</div>
<div class="fade-in">

<h2 class="clue-title">The Anagram</h2>
<p class="desc">Rearrange these scrambled letters to reveal your final destination. Two words. Tap letters to place them.</p>
<div class="puzzle-box">
  <div id="tiles" style="display:flex;justify-content:center;gap:8px;margin-bottom:24px;flex-wrap:wrap"></div>
  <div id="slots" style="display:flex;justify-content:center;gap:6px"></div>
</div>
<button class="btn" onclick="resetAnagram()" style="background:transparent;border:1px solid rgba(212,165,116,0.3);color:var(--cream);opacity:0.6;margin-top:12px">Reset</button>
<style>
.tile {
  width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
  font-family: 'Courier Prime', monospace; font-size: 24px; font-weight: 700;
  color: var(--gold); background: rgba(212,165,116,0.1);
  border: 2px solid var(--gold); border-radius: 8px;
  cursor: pointer; transition: all 0.2s; opacity: 0.8;
}
.tile.selected { color: var(--dark); background: var(--gold); opacity: 1; transform: scale(0.9); }
.slot {
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  border-bottom: 2px solid rgba(212,165,116,0.3);
  font-family: 'Courier Prime', monospace; font-size: 22px; font-weight: 700;
  color: var(--gold); transition: all 0.2s;
}
.slot.wrong { border-color: var(--red) !important; color: var(--red) !important; }
</style>

<div id="hint-area">
  <button class="hint-btn" onclick="document.getElementById('hint-area').innerHTML='<p class=hint-text>💡 A place where four-legged friends roam free</p>'">Need a hint?</button>
</div>
<div class="success-card" id="success" style="display:none">
  <div class="egg-icon">🥚</div>
  <p class="answer">DOG PARK</p>
  <p class="message">Your final egg awaits at the dog park! Go claim your prize! 🏆</p>
</div>
<script>
const LETTERS = ['K','R','A','P','G','O','D'];
const ANSWER = 'DOGPARK';
let selected = [];
let tiles = [];

function initAnagram() {
  const tilesEl = document.getElementById('tiles');
  const slotsEl = document.getElementById('slots');
  tilesEl.innerHTML = '';
  slotsEl.innerHTML = '';
  selected = [];
  tiles = LETTERS.map((l, i) => ({letter: l, id: i, sel: false}));
  tiles.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tile';
    btn.textContent = t.letter;
    btn.id = 'tile-' + t.id;
    btn.onclick = () => toggleTile(t.id);
    tilesEl.appendChild(btn);
  });
  for (let i = 0; i < LETTERS.length; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.id = 'slot-' + i;
    slotsEl.appendChild(slot);
  }
}

function toggleTile(id) {
  const t = tiles.find(x => x.id === id);
  if (t.sel) {
    t.sel = false;
    selected = selected.filter(s => s.id !== id);
    document.getElementById('tile-' + id).classList.remove('selected');
  } else {
    t.sel = true;
    selected.push(t);
    document.getElementById('tile-' + id).classList.add('selected');
  }
  updateSlots();
  if (selected.length === LETTERS.length) {
    const word = selected.map(s => s.letter).join('');
    if (word === ANSWER) {
      setTimeout(() => {
        document.getElementById('success').style.display = 'block';
        document.getElementById('hint-area').style.display = 'none';
        document.querySelector('.puzzle-box').style.display = 'none';
      }, 400);
    } else {
      document.querySelectorAll('.slot').forEach(s => s.classList.add('wrong'));
      setTimeout(resetAnagram, 800);
    }
  }
}

function updateSlots() {
  for (let i = 0; i < LETTERS.length; i++) {
    const slot = document.getElementById('slot-' + i);
    slot.textContent = selected[i] ? selected[i].letter : '';
    slot.style.borderColor = selected[i] ? 'var(--gold)' : 'rgba(212,165,116,0.3)';
    slot.classList.remove('wrong');
  }
}

function resetAnagram() { initAnagram(); }
initAnagram();
</script>

</div>
</div>
</body>
</html>
